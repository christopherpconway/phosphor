name: build-macos

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the built bundle to (e.g. v0.4.0). Empty = artifacts only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Self-signed "Phosphor Dev" identity (scripts/make-signing-cert.sh).
      # A stable certificate is what lets macOS keep TCC grants across
      # rebuilds; unsigned or ad-hoc bundles reset them every release.
      - name: Import code-signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # Self-signed: trust it or find-identity reports 0 valid identities.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign scripts/phosphor-dev.cer
          security find-identity -v -p codesigning build.keychain | grep '"Phosphor Dev"'
          rm certificate.p12

      - name: Build
        env:
          # Signs the updater bundle (.app.tar.gz.sig); the matching public
          # key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          npm run tauri build -- --target universal-apple-darwin

      - name: Prove the bundle is signed with a certificate
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/phosphor.app
          codesign --verify --deep --strict -v "$app"
          codesign -d -r- "$app" 2>&1 | tee /dev/stderr | grep -q 'certificate leaf'

      # Release assets are the real destination and do not count against the
      # Actions artifact storage quota (which locked builds out twice on
      # 2026-08-22/23 even after the backlog was deleted).
      - name: Upload bundle to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            --clobber --repo "${{ github.repository }}"
          scripts/updater-manifest.sh "${{ inputs.release_tag }}" darwin-universal \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

      - uses: actions/upload-artifact@v4
        # Convenience copy only; a stale storage-quota snapshot must not fail
        # the build (the release upload above is the one that matters).
        continue-on-error: true
        with:
          name: phosphor-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          # These bundles are unsigned and the private-repo artifact quota is
          # small; without expiry they pile up and block new uploads
          # (see build-linux.yml, 2026-08-22).
          retention-days: 7
          # Replace the previous build's artifact of the same name instead of
          # erroring, so re-runs don't leave orphans counting against quota.
          overwrite: true
